[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mats-morpho"
version = "1.0.0"
description = "Field morphometric tools: RF-DETR marker detection + BiRefNet leaf segmentation from photos of a printed calibration template."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "A.J. Ackerman" }]
keywords = ["plant phenomics", "morphometrics", "leaf area", "segmentation", "RF-DETR", "BiRefNet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Science/Research",
]

# Runtime dependencies for the pipeline + CLI. QR codes are decoded with OpenCV
# by default, so there is no system-library requirement here -- everything below
# installs from wheels. Enhanced QR reading is the optional `qr` extra below;
# its pyzbar backend additionally needs the system `zbar` library, while
# QReader works without it.
dependencies = [
    "rfdetr",
    "transformers",
    "torch",
    "torchvision",
    # Required by the bundled BiRefNet architecture.  They stay normal runtime
    # dependencies so selecting BiRefNet never requires environment-specific
    # setup beyond installing MATS itself.
    "einops",
    "kornia",
    "timm",
    "opencv-python",
    "pillow",
    "numpy",
    "tqdm",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# Enhanced QR reading: pyzbar + qreader fallbacks for codes OpenCV can't decode
# (glare, skew, blur). pyzbar additionally needs the system library `zbar`
# (apt: libzbar0; brew: zbar; conda: `conda install -c conda-forge zbar`), but
# QReader remains usable without Conda or zbar.
qr = ["pyzbar", "qreader"]
# The Streamlit GUI and the Template Creator page.
app = ["streamlit", "reportlab", "qrcode"]
# Development / testing (no torch needed for the dependency-light tests).
dev = ["pytest"]

[project.scripts]
mats = "mats.cli:main"

[project.urls]
Homepage = "https://github.com/Breeding-Insight/Morphometric-Analysis-Toolbox-for-Segmentation"
Issues = "https://github.com/Breeding-Insight/Morphometric-Analysis-Toolbox-for-Segmentation/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mats = [
    "app/.streamlit/config.toml",
    "app/assets/*.svg",
    "app/assets/samples/*.md",
    "app/assets/samples/*/*.jpg",
    "models/birefnet/LICENSE",
]
