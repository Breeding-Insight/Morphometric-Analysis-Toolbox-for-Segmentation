[theme]
base = "light"
primaryColor = "#1F6F5B"
backgroundColor = "#FBFCF8"
secondaryBackgroundColor = "#F1F5EE"
textColor = "#20302A"
borderColor = "#D4DED3"
linkColor = "#1F6F5B"
codeBackgroundColor = "#EDF3EA"
codeTextColor = "#20302A"
greenColor = "#237A57"
orangeColor = "#B36B17"
redColor = "#B5473A"
blueColor = "#287B93"
grayColor = "#5F6C66"
chartCategoricalColors = ["#1F6F5B", "#287B93", "#B36B17", "#647A43", "#8C5F96", "#B5473A"]
chartSequentialColors = ["#F3F8F1", "#E3EFE0", "#CDE2C8", "#B1D4AA", "#91C28A", "#6FAA6D", "#4B9257", "#337A48", "#28633E", "#1F4E32"]
