<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img"
     aria-label="MATS — Morphometric Analysis Toolbox for Segmentation">
  <title>MATS — Morphometric Analysis Toolbox for Segmentation</title>
  <style>
    /* red = fiducial markers, grey = ROI box, green = leaf + wordmark */
    .frame { fill: none; stroke: #8c8c8c; stroke-width: 3.5;
             stroke-linecap: round; stroke-linejoin: round; }
    .marker{ fill: none; stroke: #d62828; stroke-width: 3; }
    .dot   { fill: #d62828; stroke: none; }
    .leaf  { fill: none; stroke: #25463d; stroke-linecap: round; stroke-linejoin: round; }
    /* strokes must scale with the artwork -- non-scaling-stroke pins them to a
       fixed screen width, which fills the leaf in solid at header sizes */
    .blade { stroke-width: 4; }
    .rib   { stroke-width: 3; }
    .vein  { stroke-width: 2.4; }
    .word  { fill: #25463d; font-family: "Helvetica Neue", Arial, sans-serif;
             font-weight: 600; font-size: 78px; letter-spacing: 1px; }
    .tag   { fill: #8c8c8c; font-family: "Helvetica Neue", Arial, sans-serif;
             font-weight: 400; font-size: 21px; letter-spacing: 2px; }
  </style>

  <g transform="translate(4,8) scale(0.92)">
    <g class="frame">
      <path d="M44,34 L156,34"/>
      <path d="M166,44 L166,156"/>
      <path d="M156,166 L44,166"/>
      <path d="M34,156 L34,44"/>
    </g>
    <circle class="marker" cx="34"  cy="34"  r="10"/><circle class="dot" cx="34"  cy="34"  r="2.5"/>
    <circle class="marker" cx="166" cy="34"  r="10"/><circle class="dot" cx="166" cy="34"  r="2.5"/>
    <circle class="marker" cx="166" cy="166" r="10"/><circle class="dot" cx="166" cy="166" r="2.5"/>
    <circle class="marker" cx="34"  cy="166" r="10"/><circle class="dot" cx="34"  cy="166" r="2.5"/>
    <g class="leaf" transform="translate(100,100) scale(0.84) translate(-100,-100)">
      <path class="blade" d="M100,158 C66,132 66,74 100,42 C134,74 134,132 100,158 Z"/>
      <path class="rib"   d="M100,155 L100,47"/>
      <path class="vein"  d="M100,135 C90,132 82,126 76,118"/>
      <path class="vein"  d="M100,135 C110,132 118,126 124,118"/>
      <path class="vein"  d="M100,112 C92,109 86,104 81,97"/>
      <path class="vein"  d="M100,112 C108,109 114,104 119,97"/>
      <path class="vein"  d="M100,90 C94,87 90,83 86,77"/>
      <path class="vein"  d="M100,90 C106,87 110,83 114,77"/>
    </g>
  </g>

  <!-- textLength pins each row's width so the lockup is stable when the
       renderer falls back to a wider sans-serif (e.g. DejaVu on Linux) -->
  <text class="word" x="212" y="96">MATS</text>
  <text class="tag" x="215">
    <tspan x="215" y="133" textLength="326" lengthAdjust="spacing">MORPHOMETRIC ANALYSIS</tspan>
    <tspan x="215" y="160" textLength="374" lengthAdjust="spacing">TOOLBOX FOR SEGMENTATION</tspan>
  </text>
</svg>
