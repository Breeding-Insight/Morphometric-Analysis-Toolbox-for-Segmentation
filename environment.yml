# Optional conda environment for MATs. Conda is NOT required: the default install
# decodes QR codes with OpenCV and pulls everything from wheels, so a plain
# virtualenv works too --
#
#   python3.13 -m venv .venv && source .venv/bin/activate
#   python -m pip install --upgrade pip
#   python -m pip install -e ".[app]"
#
# (Starting from a computer with no Python? See docs/install.md.)
#
# This file is a convenience for users who already prefer conda. It includes
# `zbar` for the optional pyzbar QR fallback; neither Conda nor zbar is needed
# for the default OpenCV decoder or the optional QReader fallback:
#
#   conda env create -f environment.yml
#   conda activate mats
#   python -m pip install -e ".[app,qr]"   # [qr] adds the pyzbar/qreader QR fallbacks
#   mats doctor
#
# The clone already brings the RF-DETR checkpoint through Git LFS; run
# `mats fetch-weights` only if `mats doctor` reports it missing.
name: mats
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - zbar            # system library for the optional [qr] extra's pyzbar backend
  - pip:
      - -e ".[app]"    # add ",qr" -> ".[app,qr]" to enable enhanced QR reading
